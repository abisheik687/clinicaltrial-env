[project]
name = "clinicaltrial-env"
version = "1.0.0"
description = "An OpenEnv clinical trial operations environment for safe enrollment decisions."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [
  { name = "ClinicalTrialEnv Team" }
]
dependencies = [
  "fastapi>=0.115.2,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic[email]>=2.11.7,<3",
  "pydantic-settings>=2.5.2,<3",
  "faker>=30,<40",
  "numpy>=2.1,<3",
  "pyyaml>=6.0.2,<7",
  "python-multipart>=0.0.18,<1",
  "httpx>=0.28.1,<1",
  "openai>=2.7.2",
  "openenv-core>=0.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
]
training = [
  "torch>=2.6,<3",
  "accelerate>=1.0.1",
  "datasets>=3.0.1",
  "jmespath>=1.0.1",
  "matplotlib>=3.9.2",
  "pandas>=2.2.3",
  "peft>=0.13.2",
  "trl>=0.11.4",
  "transformers>=4.45.2",
]

[project.scripts]
server = "server.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server"]
