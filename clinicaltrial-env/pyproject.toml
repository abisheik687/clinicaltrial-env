[project]
name = "clinicaltrial-env"
version = "1.0.0"
description = "An OpenEnv clinical trial screening environment."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "ClinicalTrialEnv Team" }
]
dependencies = [
  "openenv-core>=0.2.0"
]

[project.scripts]
server = "server.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server"]
