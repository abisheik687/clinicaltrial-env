name: clinicaltrial-env
version: "1.0.0"
description: >
  A clinical trial operations environment where agents learn safe enrollment
  decisions under partial information, protocol amendments, and operational
  constraints.
author: "ClinicalTrialEnv Team"
license: "MIT"
tags:
  - openenv
  - healthcare
  - clinical-trials
  - professional-workflow
  - multi-step
  - verifier-driven

environment:
  type: "sequential-decision"
  episode_types:
    - single_patient_screening
  action_space: "discrete+structured"
  observation_space: "structured-dict"
  reward_range: [-1.0, 1.0]
  max_steps_per_episode: 20
  deterministic: true

tasks:
  - id: task1
    name: "Single Criterion Hypertension Screening"
    difficulty: easy
    max_steps: 8
    description: "Screen a patient for a hypertension trial with clear eligibility and exclusion rules."
  - id: task2
    name: "Multi-Criteria Oncology Screening"
    difficulty: medium
    max_steps: 14
    description: "Screen a patient for a CAR-T trial with compound marrow checks and medication reasoning."
  - id: task3
    name: "Ambiguous Gene Therapy Screening with Protocol Amendment"
    difficulty: hard
    max_steps: 20
    description: "Screen a patient for gene therapy with ambiguous evidence and a mid-episode protocol amendment."

api:
  framework: fastapi
  base_url: "http://localhost:7860"
  endpoints:
    reset: "POST /reset"
    step: "POST /step"
    state: "GET /state"
    health: "GET /health"

deployment:
  platform: huggingface-spaces
  space_sdk: docker
  dockerfile: "Dockerfile"
  hf_space_tags: ["openenv"]

baseline:
  script: "training/grpo_phase1.py"
  evaluation_script: "training/evaluate_models.py"
  model: "Qwen/Qwen2.5-3B-Instruct"
